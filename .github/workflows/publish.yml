name: Publish core

# Publishes tv.own.owntv:core and tv.own.owntv:player-core to OwnTV's public Maven repository (this
# repo's gh-pages branch, https://ahxn00.github.io/OwnTV_Core/maven — no login to download) when a
# core-* tag is pushed, then publishes the GitHub Release for that tag. Both modules always go out together on the
# same version, taken from `coreVersion` in the root build file — the tag must match it, and the job
# checks that before publishing anything.
#
# Order matters, and it is the design: the tag check, then the FULL gate — `build.yml` and
# `i18n.yml`, called rather than copied — then the Maven publish, then the release. The release is
# therefore proof that everything before it succeeded, which is exactly why `bump-consumers.yml`
# triggers on the release and not on the tag. Push a tag that fails anything and you get no artifacts,
# no release, no pin-bump pull request, and a clean chance to fix it and re-tag.
#
# The gate used to be unit tests only, with lint racing the publish from `build.yml`'s own tag
# trigger and the i18n checks not running on a tag at all. Both of those holes have been closed; see
# the comment on the gate jobs.
#
# Both the Maven publish and the RELEASE use CONSUMER_BUMP_TOKEN (Contents: write on this repo): a
# gh-pages push made with GITHUB_TOKEN is not guaranteed to start the Pages build, and a release made
# with it never starts bump-consumers. Consumers need no token at all.

on:
  push:
    tags: [ "core-*" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never cancel a half-finished publish

jobs:
  # Seconds, and first: a tag that disagrees with the version in the build file publishes an artifact
  # nobody can find from the tag it was cut at. Its own job so a mistyped tag fails immediately
  # instead of after a full CI run.
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match coreVersion
        if: startsWith(github.ref, 'refs/tags/core-')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#core-}"
          BUILD_VERSION=$(sed -n 's/^extra\["coreVersion"\] *= *"\(.*\)"$/\1/p' build.gradle.kts)
          echo "tag=$TAG_VERSION  build.gradle.kts=$BUILD_VERSION"
          [ "$TAG_VERSION" = "$BUILD_VERSION" ]

  # The full gate, and the whole point of this restructuring. These are the repository's own CI
  # workflows, CALLED rather than copied, so the publish can never drift out of step with what a push
  # to main is held to.
  #
  # They used to run beside the publish instead of in front of it: `build.yml` triggered on the tag in
  # parallel, and `i18n.yml` did not trigger on a tag at all. So a tag could reach the package registry
  # while lint was still analysing, and a version could ship a string that existed in English and
  # nowhere else. core-1.0.34 is the worked example — lint's PluralsCandidate failed *after* the
  # packages were immutable, and the fix could only be a version of its own.
  #
  # Gradle's `build` includes both modules' unit tests, so the separate unit-test step that used to
  # live in the publish job is gone rather than duplicated.
  gate-build:
    needs: verify-tag
    uses: ./.github/workflows/build.yml

  gate-i18n:
    needs: verify-tag
    uses: ./.github/workflows/i18n.yml

  publish:
    needs: [gate-build, gate-i18n]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 'tools' is obsolete and Google removed it from the SDK repository; the
          # action still asks for it by default, which fails the whole setup step.
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Staged locally, then copied into gh-pages by tools/publish_pages.py (identical copy in
      # ahXN00/OwnTV_libmpv). It refuses an already-published version, keeps the newest 30, and
      # waits until Pages actually serves the new POMs — so the release below, and the pin-bump
      # pull requests it triggers, never run ahead of the files.
      - name: Publish to the OwnTV Maven repository
        env:
          PAGES_TOKEN: ${{ secrets.CONSUMER_BUMP_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew publishAllPublicationsToStagingRepository --stacktrace
          python3 tools/publish_pages.py build/staging-maven --keep core=30 --keep player-core=30

      # LAST step on purpose. The release is the visible, human-readable record that this version
      # exists — and it is also the trigger for `bump-consumers.yml`, which opens the pin-bump pull
      # request on every app. Creating it here, after the tests and the publish, means a release can
      # only appear for a version that actually built and is actually served by the Maven repository. A failed
      # run leaves no release, so no consumer is ever pinned to something that does not exist, and
      # there is a chance to fix the problem and re-tag before anything downstream moves.
      #
      # CONSUMER_BUMP_TOKEN, not GITHUB_TOKEN: GitHub does not trigger workflows from events raised
      # by the built-in token, so a release created with it would never start the bump. Do not
      # "simplify" this to github.token — it fails silently, with a green run and no pull request.
      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/core-')
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_BUMP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::CONSUMER_BUMP_TOKEN is not set on this repository."
            echo "A release created with GITHUB_TOKEN would not trigger the consumer bump."
            exit 1
          fi

          # Body = this version's section of CHANGELOG.md, from "## <tag>" to the next "## core-".
          # Same shape as the TV app's release-notes workflow.
          awk -v ver="$TAG" '
            $0 ~ ("^## " ver "([ \t]|$)") { flag=1; next }
            /^## core-/ && flag { flag=0 }
            flag { print }
          ' CHANGELOG.md > notes.md || true
          sed -i -e '/./,$!d' notes.md
          awk 'NF{p=NR} {a[NR]=$0} END{for(i=1;i<=p;i++) print a[i]}' notes.md > notes.trimmed.md
          mv notes.trimmed.md notes.md

          if [ ! -s notes.md ]; then
            echo "::warning::No CHANGELOG.md section for $TAG — publishing the release without notes."
            printf 'Published to https://ahxn00.github.io/OwnTV_Core/maven (no login) as `tv.own.owntv:core:%s` and `tv.own.owntv:player-core:%s`.\n' \
              "${TAG#core-}" "${TAG#core-}" > notes.md
          fi

          echo "----- notes for $TAG -----"
          cat notes.md
          echo "--------------------------"

          # Idempotent: re-running the workflow on an existing tag updates the release instead of
          # failing. `gh release edit` does not re-fire the `published` event, which is correct —
          # the consumers were already bumped the first time.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating its notes."
            gh release edit "$TAG" --title "OwnTV Core $TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "OwnTV Core $TAG" --notes-file notes.md --verify-tag
          fi
