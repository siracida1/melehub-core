name: Bump consumers

# After a core version is published, open a pin-bump pull request on every app that consumes core.
#
# The apps hold no core code, so the PR is tiny — it moves `owntvCore` in the app's version
# catalogue to the version just published, and nothing else builds differently as a result. It also
# copies `tools/i18n/locales.json` across, which is the one file deliberately duplicated between
# core and each app: Gradle reads `packaged` from the APP's copy at configure time to build
# localeFilters, so core's copy never reaches it. Left to a human that step is silently skipped and
# a newly finished language is stripped out of the APK with every check green.
#
# This workflow only OPENS the PR; it never merges. Merging is the consumer repo's business, and the
# TV app decides to do it itself: `automerge-core-bump.yml` in ahXN00/OwnTV merges the PR once every
# check on it is green, guarded on the branch name, the author, and a diff touching only the two
# files below. A consumer without that workflow simply gets a PR that waits for a human.
#
# Either way the PR is the point: the maintainer builds against core's SOURCE locally
# (owntv.corePath), so he has already been running this code for a while. The PR is what makes CI
# and the released APK agree with him.
#
# CONSUMER_BUMP_TOKEN must be a PAT with `repo` scope on the consumer repositories. The built-in
# GITHUB_TOKEN cannot write to another repository, and — just as important — pull requests opened
# with GITHUB_TOKEN do not trigger the target repo's workflows, so the PR would sit there with no
# checks at all.

# Triggered by the GitHub RELEASE, not by the tag. The release is created by "Publish core" as its
# last step, so it exists only if the unit tests passed and both artifacts are actually served by
# OwnTV's Maven repository. That makes the release the single visible gate: no release means no pin-bump PR, and the
# version is there on the Releases page for users to read before any consumer moves to it.
#
# For this to fire at all, the release must be created with CONSUMER_BUMP_TOKEN, not GITHUB_TOKEN —
# GitHub deliberately does not trigger workflows from events raised by the built-in token, so a
# release published by GITHUB_TOKEN would sit there and nothing would happen. "Publish core" does
# that correctly; do not "simplify" it back to github.token.
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: "Core version to pin. Defaults to coreVersion in build.gradle.kts."
        required: false

permissions:
  contents: read

concurrency:
  group: bump-consumers
  cancel-in-progress: false

jobs:
  bump:
    # A release only exists if "Publish core" got as far as creating it, so reaching here already
    # means the tests passed and both artifacts are served by OwnTV's Maven repository. The tag-name guard is the
    # remaining check: this repo could carry some other release series one day, and pinning
    # consumers to a version that was never published as core breaks every contributor's build.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'core-')
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false          # one consumer failing must not block the others
      matrix:
        consumer:
          - ahXN00/OwnTV
          # Private until the mobile app's first release, so CONSUMER_BUMP_TOKEN has to grant access
          # to it explicitly — a fine-grained PAT lists repositories one by one, and adding this line
          # without adding the repo to the token fails on `gh pr list` with a 404 that reads exactly
          # like a typo. It carries its own `automerge-core-bump.yml` since Plan 3 Phase 5, so its
          # pull request merges itself once green, exactly like the TV app's.
          - ahXN00/OwnTV_Mobile

    steps:
      # Check out the RELEASED commit, not whatever main has drifted to. `tools/i18n/locales.json`
      # is copied from here into the consumer, and it must be the catalogue that belongs to the
      # version being pinned — main may already carry a locale that is not in this release.
      - name: Checkout core
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Resolve the version to pin
        id: v
        env:
          # Empty on workflow_dispatch. On a release this is `core-x.y.z`, and it is authoritative:
          # `coreVersion` in the build file may already have moved on to the next version.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ] && [ -n "${RELEASE_TAG:-}" ]; then
            VERSION="${RELEASE_TAG#core-}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(sed -n 's/^extra\["coreVersion"\] *= *"\(.*\)"$/\1/p' build.gradle.kts)
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine the core version to pin."
            exit 1
          fi
          echo "Pinning consumers to core $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Open the pin-bump pull request
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_BUMP_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
          CONSUMER: ${{ matrix.consumer }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::CONSUMER_BUMP_TOKEN is not set on this repository."
            echo "Add a fine-grained PAT for OwnTV, OwnTV_Core and OwnTV_Mobile with Contents and Pull"
            echo "requests read/write: Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          BRANCH="bump/core-${VERSION}"

          if [ -n "$(gh pr list --repo "$CONSUMER" --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            echo "A pull request for $BRANCH is already open on $CONSUMER — nothing to do."
            exit 0
          fi

          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${CONSUMER}.git" consumer
          cd consumer
          git switch -c "$BRANCH"

          # The pin. Verified after the edit: a silently unmatched sed would open an empty PR.
          sed -i -E "s|^owntvCore = \".*\"$|owntvCore = \"${VERSION}\"|" gradle/libs.versions.toml
          if ! grep -qx "owntvCore = \"${VERSION}\"" gradle/libs.versions.toml; then
            echo "::error::Could not set owntvCore in gradle/libs.versions.toml on $CONSUMER."
            exit 1
          fi

          # The duplicated locale catalogue — see the header.
          cp ../tools/i18n/locales.json tools/i18n/locales.json

          if git diff --quiet; then
            echo "$CONSUMER is already on core ${VERSION} with an identical locale catalogue."
            exit 0
          fi

          # Written through files: multi-line text is far easier to keep readable here than inline.
          cat > ../commit-message.txt <<EOF
          Pin core ${VERSION}

          Core ${VERSION} is published. This moves owntvCore to it so CI and the released APK build
          against the same core the maintainer already builds against locally, and refreshes the
          duplicated locale catalogue so a newly packaged language is not stripped out of the APK.

          Opened automatically by the core repository's publish workflow.
          EOF

          cat > ../pr-body.md <<EOF
          Core \`${VERSION}\` has been published to OwnTV's Maven repository (https://ahxn00.github.io/OwnTV_Core/maven).

          - \`owntvCore\` moved to \`${VERSION}\` in \`gradle/libs.versions.toml\`
          - \`tools/i18n/locales.json\` refreshed from core

          Local builds resolve core from source via \`owntv.corePath\` and ignore this pin, so this
          pull request is what makes CI and the released APK agree with what has already been tested
          locally.

          Merge once the checks are green. See the core changelog for what \`${VERSION}\` contains.
          EOF

          git config user.name  "Ashiq Hasan"
          git config user.email "ashiq.hasan@hotmail.com"
          git commit -a --file ../commit-message.txt

          git push --force-with-lease origin "$BRANCH"

          gh pr create \
            --repo "$CONSUMER" \
            --base main \
            --head "$BRANCH" \
            --title "Pin core ${VERSION}" \
            --body-file ../pr-body.md
